meters:
- name: subscription_fee
  description: Recurring platform subscription fee for the Advanced A/R or Enterprise A/R package.
  unit: subscription
  aggregation: sum
  dimensions:
  - account
  - plan
- name: per_invoice_fee
  description: Optional per-invoice fee charged on pay-as-you-go A/R plans.
  unit: invoices
  aggregation: sum
  dimensions:
  - account
- name: payment_processing_fees
  description: Downstream processing fees on payments collected through the platform.
  unit: transactions
  aggregation: sum
  dimensions:
  - account
  - method
principles:
- name: Visibility
  description: Track subscription tier, per-invoice fees, and payment-processing costs against A/R volume.
- name: Allocation
  description: Tag API keys and customers/metadata per business unit to map platform cost to revenue cohorts.
- name: Optimization
  description: Choose the subscription tier matched to invoice volume; route collections to lower-fee payment methods (ACH vs. card) where feasible.
- name: Accountability
  description: Assign an owner for the Invoiced contract; review subscription and processing spend against collected receivables.
