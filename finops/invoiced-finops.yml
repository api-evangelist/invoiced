description: >-
  FinOps view of Invoiced spend. Invoiced is a sales-led SaaS subscription
  (Advanced A/R and Enterprise A/R packages) rather than a usage-metered API,
  so cost is driven primarily by the negotiated subscription, optional per-
  invoice fees on pay-as-you-go plans, and downstream payment-processing fees
  on collected transactions. The REST API is included with the subscription and
  is not billed separately. Exact rates are sales-led and not reconciled here.
notes: >-
  Confirm subscription tier, per-invoice fees, and payment-processing rates
  with Invoiced sales during reconciliation; pricing is quote-based.
sources:
- https://www.invoiced.com/accounts-receivable/pricing
- https://developer.invoiced.com/api
- https://focus.finops.org/focus-specification/v1-3/
